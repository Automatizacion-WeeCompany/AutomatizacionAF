name: Pruebas automatizadas E2E

on:
  # Permite ejecutar las pruebas manualmente desde GitHub.
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente donde se ejecutarán las pruebas
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - produccion
      tipo_ejecucion:
        description: Cobertura de la ejecución manual
        required: true
        default: rapida
        type: choice
        options:
          - smoke
          - rapida
          - completa

  # Ejecuta las pruebas de lunes a viernes a las 02:00.
  schedule:
    - cron: "0 2 * * 1-5"
      timezone: "America/Mexico_City"

  # Ejecuta las pruebas cuando se actualice main.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pruebas-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas-e2e:
    name: Ejecutar Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"
      CI_WORKERS: "3"
      AMBIENTE: ${{ inputs.ambiente || 'qa' }}
      BASE_URL_QA: ${{ vars.BASE_URL_QA }}
      BASE_URL_STAGING: ${{ vars.BASE_URL_STAGING }}
      BASE_URL_PRODUCCION: ${{ vars.BASE_URL_PRODUCCION }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Mostrar configuración de ejecución
        run: |
          echo "CI=$CI"
          echo "CI_WORKERS=$CI_WORKERS"
          echo "AMBIENTE=$AMBIENTE"
          echo "EVENTO=${{ github.event_name }}"
          echo "TIPO_EJECUCION=${{ inputs.tipo_ejecucion || 'automatico-segun-evento' }}"

      - name: Ejecutar smoke
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tipo_ejecucion == 'smoke') }}
        run: npx playwright test --config=playwright.ci.config.ts

      - name: Ejecutar regresión rápida en Chromium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tipo_ejecucion == 'rapida' }}
        run: npx playwright test --config=src/configuraciones/playwright.config.ts --project=Chromium

      - name: Ejecutar regresión completa
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tipo_ejecucion == 'completa') }}
        run: npx playwright test --config=src/configuraciones/playwright.config.ts

      - name: Guardar reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: reporte-playwright-${{ github.event_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            Evidencias/reportes-ci/
          retention-days: 30
          if-no-files-found: warn

      - name: Guardar evidencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: evidencias-${{ github.event_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            test-results/
            Evidencias/
          retention-days: 15
          if-no-files-found: ignore
